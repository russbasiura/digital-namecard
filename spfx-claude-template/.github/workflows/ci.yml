name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until the SPFx solution is scaffolded
        id: check
        run: echo "ready=$([ -f spfx/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version-file: spfx/.nvmrc
          cache: npm
          cache-dependency-path: spfx/package-lock.json
      - run: pip install openpyxl
        if: steps.check.outputs.ready == 'true'
      - name: Lint, test, production build, package
        if: steps.check.outputs.ready == 'true'
        run: bash scripts/build.sh
      - name: Traceability gate
        if: steps.check.outputs.ready == 'true'
        run: python3 scripts/traceability.py
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: sppkg
          path: spfx/sharepoint/solution/*.sppkg
